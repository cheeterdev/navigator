<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <title>Cheeter Space</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS -->
    <link rel="stylesheet" href="./start.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<h1 class="section-title section-header" id="welcome-message">Whats on your Mind?</h1>
<form class="search-container" id="search-form">
    <input type="text" class="search-input" id="search-input" placeholder="Browse the Space..." required autocomplete="off">
    <button type="submit" class="search-button">🔍</button>
</form>

<!-- Main Content -->
<div class="content">
    <section id="rss-home-panel">
        <div id="rss-home-entries" class="news-grid"></div>
        <div class="section-header">
            <button id="rss-home-refresh" class="refresh">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                <h6>Refresh</h6>
            </button>
        </div>
        <div id="rss-home-status" class="loading hidden"><div class="spinner"></div></div>
    </section>
</div>

<script src="./start.js"></script>
</body>
</html>
